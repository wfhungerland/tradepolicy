# Download Regionaldatenbank and Destatis GENESIS tables with credentials stored as GitHub Actions secrets.
# Secrets (repository settings > Secrets and variables > Actions), never in files:
#   GENESIS_RDB_USER, GENESIS_RDB_PASSWORD             account of www.regionalstatistik.de
#   GENESIS_DESTATIS_USER, GENESIS_DESTATIS_PASSWORD   account of genesis.destatis.de
# What to fetch is set in the env block below (or as inputs of a manual run): table codes and search terms,
# separated by spaces; search terms use + for blanks. Earlier downloads on the branch data-genesis are kept,
# new files are added or replace files of the same name. Results are public statistics without credentials.
# Fetched so far: 42111-04-02-4 manufacturing sales by district; 71231-01-03-4 local taxes by district;
# 51000-0032 exports by Land and country; 51000-0034 exports by Land and product group (GP 2-digit).
name: GENESIS-Daten laden

on:
  workflow_dispatch:
    inputs:
      rdb_tables: {description: "Regionaldatenbank tables", required: false, default: ""}
      destatis_tables: {description: "Destatis tables", required: false, default: ""}
      searches: {description: "Destatis search terms (+ for blanks)", required: false, default: ""}
      start: {description: "First year", required: false, default: "2008"}
  push:
    branches: [claude/pensive-pascal-6pn12g]
    paths: [.github/workflows/fetch-genesis.yml, tools/server_fetch_kreise.py]

permissions:
  contents: write

env:
  RDB_TABLES: ${{ inputs.rdb_tables || '' }}
  DESTATIS_TABLES: ${{ inputs.destatis_tables || '' }}
  SEARCHES: ${{ inputs.searches || 'Ausfuhr+Bundesländer+Länder+Güterabteilungen Außenhandel+Bundesländer+Warensystematik Ausfuhr+Länder+Güterabteilungen' }}
  START: ${{ inputs.start || '2008' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep earlier downloads
        run: |
          mkdir -p data/genesis
          if git ls-remote --exit-code --heads origin data-genesis; then
            git fetch -q origin data-genesis
            git archive origin/data-genesis data/genesis | tar -x
          fi
          ls -la data/genesis
      - name: Regionaldatenbank tables
        if: env.RDB_TABLES != ''
        continue-on-error: true
        env:
          GENESIS_USER: ${{ secrets.GENESIS_RDB_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_RDB_PASSWORD }}
        run: python tools/server_fetch_kreise.py --out data/genesis --work /tmp/work --tables $RDB_TABLES --start $START
      - name: Destatis searches
        if: env.SEARCHES != ''
        continue-on-error: true
        env:
          GENESIS_USER: ${{ secrets.GENESIS_DESTATIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_DESTATIS_PASSWORD }}
        run: |
          rm -f data/genesis/search_destatis.txt
          for s in $SEARCHES; do
            t="${s//+/ }"
            echo "### $t" >> data/genesis/search_destatis.txt
            python tools/server_fetch_kreise.py --destatis --work /tmp/work --search "$t" >> data/genesis/search_destatis.txt || true
          done
          cat data/genesis/search_destatis.txt
      - name: Destatis tables
        if: env.DESTATIS_TABLES != ''
        continue-on-error: true
        env:
          GENESIS_USER: ${{ secrets.GENESIS_DESTATIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_DESTATIS_PASSWORD }}
        run: python tools/server_fetch_kreise.py --destatis --out data/genesis --work /tmp/work --tables $DESTATIS_TABLES --start $START
      - name: Push results to branch data-genesis
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git switch -c data-genesis-new
          git rm -r -q --cached . > /dev/null
          git add -f data/genesis
          git commit -q -m "GENESIS downloads $(date -u +%Y-%m-%d)"
          git push -f origin data-genesis-new:data-genesis
