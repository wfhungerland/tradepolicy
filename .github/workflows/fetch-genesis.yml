# Download Regionaldatenbank and Destatis GENESIS tables with credentials stored as GitHub Actions secrets.
# Secrets (repository settings > Secrets and variables > Actions), never in files:
#   GENESIS_RDB_USER, GENESIS_RDB_PASSWORD             account of www.regionalstatistik.de
#   GENESIS_DESTATIS_USER, GENESIS_DESTATIS_PASSWORD   account of genesis.destatis.de
# Results (public statistics, no credentials) are pushed to the branch data-genesis, folder data/genesis.
name: GENESIS-Daten laden

on:
  workflow_dispatch:
  push:
    branches: [claude/pensive-pascal-6pn12g]
    paths: [.github/workflows/fetch-genesis.yml, tools/server_fetch_kreise.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regionaldatenbank (manufacturing sales by district, search Gewerbesteuer)
        continue-on-error: true
        env:
          GENESIS_USER: ${{ secrets.GENESIS_RDB_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_RDB_PASSWORD }}
        run: |
          if [ -z "$GENESIS_USER" ]; then echo "secret GENESIS_RDB_USER missing"; exit 1; fi
          mkdir -p data/genesis
          python tools/server_fetch_kreise.py --out data/genesis --work /tmp/work --tables 42111-04-02-4 --start 2009
          python tools/server_fetch_kreise.py --work /tmp/work --search Gewerbesteuer > data/genesis/search_gewerbesteuer.txt || true
          python tools/server_fetch_kreise.py --work /tmp/work --search Realsteuer > data/genesis/search_realsteuer.txt || true
          python tools/server_fetch_kreise.py --work /tmp/work --search Auslandsumsatz > data/genesis/search_auslandsumsatz.txt || true
          cat data/genesis/search_*.txt
      - name: Destatis (exports by Land and partner country)
        continue-on-error: true
        env:
          GENESIS_USER: ${{ secrets.GENESIS_DESTATIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_DESTATIS_PASSWORD }}
        run: |
          if [ -z "$GENESIS_USER" ]; then echo "secret GENESIS_DESTATIS_USER missing"; exit 1; fi
          mkdir -p data/genesis
          python tools/server_fetch_kreise.py --destatis --out data/genesis --work /tmp/work --tables 51000-0034 --start 2008
      - name: Push results to branch data-genesis
        run: |
          ls -la data/genesis 2>/dev/null || { echo "nothing downloaded"; exit 1; }
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git switch -c data-genesis
          git add -f data/genesis
          git commit -m "GENESIS downloads $(date -u +%Y-%m-%d)"
          git push -f origin data-genesis
