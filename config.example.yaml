# Copy this file to config.yaml and adjust the paths to your machine.
# config.yaml is listed in .gitignore and is never committed.

data:
  baci_derived: "C:/Daten/BACI/derived"          # BACI HS92 yearly .dta files
  baci_raw: "C:/Daten/BACI/raw/HS92_V202601"     # BACI raw CSV
  gravity: "C:/Daten/BACI/derived/gravity"       # CEPII Gravity V202211
  gravity_raw: "C:/Daten/BACI/raw/Gravity_V202211"  # raw Gravity CSV (population)
  tariffs: "C:/Daten/BACI/derived/tariffs"       # MAcMap-HS6
  history: "C:/Daten/BACI/derived/history"       # TRADHIST, RICardo
  comext: "C:/Daten/COMEXT"                      # Eurostat Comext, German exports by SITC
  scenarios: "C:/Daten/scenarios"                # strand 3 downloads (30_scenario_download.py)
  yotov_guide: "C:/Daten/yotov_guide/Chapter2"   # Advanced Guide application files (32_validate_yotov.py)

# All results (tables, figures, intermediate files) go here, outside the repo.
output: "C:/Daten/tradepolicy_output"

years:
  start: 1995
  end: 2024

complexity:
  focus: DEU
  peers: [CHN, USA, JPN, KOR, ITA, FRA, GBR, NLD, CHE, MEX]
  hubs: [NLD, BEL, SGP, HKG]        # re-export hubs, dropped in a robustness run
  min_population_thousands: 1000    # mean population >= 1 million
  min_exports_thousand_usd: 1000000 # mean exports >= USD 1 billion
  min_world_exports_hs4: 40000      # thousand USD, mean over years
  min_world_exports_hs6: 10000      # thousand USD, mean over years (OEC rule: a quarter of HS4)
